services:
  db:
    image: mariadb:12.3.2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mariadb-admin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      timeout: 10s
      interval: 5s
      retries: 5

  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
    depends_on:
      db:
        condition: service_healthy

  fast-store:
    image: redis:8.8.0
    command: redis-server --requirepass ${REDIS_PASSWORD}

  backend:
    build: .
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONPYCACHEPREFIX=/app/.cache/pycache
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=fast-store
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CORS_ORIGINS=${CORS_ORIGINS}
    command: uvicorn main:backend --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      fast-store:
        condition: service_started

  frontend:
    build: .
    ports:
      - "${FRONTEND_PORT}:8100"
    volumes:
      - .:/app
    environment:
      - PYTHONPYCACHEPREFIX=/app/.cache/pycache
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=fast-store
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: uvicorn main:frontend --host 0.0.0.0 --port 8100 --reload
    depends_on:
      db:
        condition: service_healthy
      fast-store:
        condition: service_started

volumes:
  mysql_data:
